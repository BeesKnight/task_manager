{% extends "tasks/base.html" %}

{% block page_header %}
  <div class="jumbotron">
    <h1 class="display-4">Система управления задачами</h1>
    <p class="lead">Создавайте задачи, назначайте сроки, выбирайте приоритет и отмечайте выполненное.</p>
    {% if user.is_authenticated %}
      <a class="btn btn-primary btn-lg" href="{% url 'tasks:task_list' %}">Открыть задачи</a>
    {% else %}
      <a class="btn btn-primary btn-lg" href="{% url 'users:register' %}">Зарегистрироваться</a>
      <a class="btn btn-outline-primary btn-lg" href="{% url 'users:login' %}">Войти</a>
    {% endif %}
  </div>
{% endblock page_header %}
